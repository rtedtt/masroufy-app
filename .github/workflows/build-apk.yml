name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python3 -c '
          import zipfile, glob, os, shutil
          zips = glob.glob("*.zip")
          assert zips, "No ZIP file found!"
          os.makedirs("extracted", exist_ok=True)
          with zipfile.ZipFile(zips[0], "r") as z:
              z.extractall("extracted")
          items = os.listdir("extracted")
          src = os.path.join("extracted", items[0]) if len(items) == 1 and os.path.isdir(os.path.join("extracted", items[0])) else "extracted"
          for item in os.listdir(src):
              dest = os.path.join(".", item)
              if os.path.exists(dest):
                  shutil.rmtree(dest) if os.path.isdir(dest) else os.remove(dest)
              shutil.move(os.path.join(src, item), dest)
          '
          rm -rf extracted local.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroufy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
