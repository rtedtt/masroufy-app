name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP automatically
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted
          if [ ! -f extracted/build.gradle.kts ] && [ $(ls -1 extracted | wc -l) -eq 1 ]; then
            SUBDIR=$(ls -1 extracted)
            cp -rf extracted/"$SUBDIR"/* .
          else
            cp -rf extracted/* .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroufy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
