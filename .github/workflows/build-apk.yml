name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean old files & Extract ZIP safely
        run: |
          rm -rf app android gradle gradlew gradlew.bat build.gradle* settings.gradle* gradle.properties dist node_modules extracted
          python3 -c '
          import zipfile, glob, os, shutil
          zips = glob.glob("*.zip")
          assert zips, "No ZIP file found!"
          os.makedirs("extracted", exist_ok=True)
          with zipfile.ZipFile(zips[0], "r") as z:
              z.extractall("extracted")
          items = os.listdir("extracted")
          src = os.path.join("extracted", items[0]) if len(items) == 1 and os.path.isdir(os.path.join("extracted", items[0])) else "extracted"
          for item in os.listdir(src):
              dest = os.path.join(".", item)
              if os.path.exists(dest):
                  shutil.rmtree(dest) if os.path.isdir(dest) else os.remove(dest)
              shutil.move(os.path.join(src, item), dest)
          '
          rm -rf extracted

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App & Wrap with Capacitor Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx cap init "Masroufy" "com.masroufy.app" --web-dir=dist
          npx cap add android
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perm = "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    "
          if "RECORD_AUDIO" not in s:
              s = s.replace("<application", perm + "<application", 1)
              open(p, "w").write(s)
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroufy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
